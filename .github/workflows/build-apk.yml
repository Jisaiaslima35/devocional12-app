name: Build Android APK (Devocional 12)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm ci || npm install

      - name: Add Capacitor android platform
        run: npx cap add android

      - name: Replace Android launcher icons with Cruz Dourada
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $d in
              mdpi)    size=48 ;;
              hdpi)    size=72 ;;
              xhdpi)   size=96 ;;
              xxhdpi)  size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            convert www/icons/app-icon-source.png \
              -resize ${size}x${size}^ \
              -gravity center -extent ${size}x${size} \
              android/app/src/main/res/mipmap-${d}/ic_launcher.png
            convert www/icons/app-icon-source.png \
              -resize ${size}x${size}^ \
              -gravity center -extent ${size}x${size} \
              android/app/src/main/res/mipmap-${d}/ic_launcher_round.png 2>/dev/null || true
            convert www/icons/app-icon-source.png \
              -resize ${size}x${size}^ \
              -gravity center -extent ${size}x${size} \
              android/app/src/main/res/mipmap-${d}/ic_launcher_foreground.png 2>/dev/null || true
          done
          echo "Icones Android atualizados"
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (assembleDebug, --no-daemon para runners 1 vCPU)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devocional12-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
